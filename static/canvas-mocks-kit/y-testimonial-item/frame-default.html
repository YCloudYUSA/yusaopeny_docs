<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y-testimonial-item · default (slot-child of y-testimonials)</title>
<link rel="stylesheet" href="../_fonts.css">
<link rel="stylesheet" href="../assets/y_canvas/css/y-canvas.css">
<link rel="stylesheet" href="../components/y-testimonials/y-testimonials.css">
<link rel="stylesheet" href="../components/y-testimonial-item/y-testimonial-item.css">
<link rel="stylesheet" href="../components/y-testimonial-item/y-testimonial-item.css">
<link rel="stylesheet" href="../_sdc-overrides.css">
<script src="../components/y-testimonials/y-testimonials.js" defer></script>
<style>
  /* Frame baseline — fonts/tokens come from y-canvas.css above (theme SoT).
   * Per-SDC fonts (Cachet vs Verdana per ws_small_y rules) opt-in via
   * --ylb-font-family-cachet / --ylb-font-family-verdana token references
   * inside each component's CSS. Frame imposes nothing extra. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body > [data-component] { overflow: hidden; }

  /* Chrome SDC placeholder (F-8) — visually distinct from broken render */
  .__chrome-placeholder { display: flex; align-items: center; justify-content: center; min-height: 320px; padding: 32px 16px; background: repeating-linear-gradient(45deg, #f5f7fb, #f5f7fb 10px, #ecf0f7 10px, #ecf0f7 20px); }
  .__chrome-placeholder__inner { max-width: 520px; padding: 28px 32px; background: #fff; border: 1px solid #d6dde8; border-radius: 10px; box-shadow: 0 4px 16px rgba(15, 23, 42, .06); font: 14px/1.55 system-ui, -apple-system, sans-serif; color: #1f2937; }
  .__chrome-placeholder__badge { display: inline-block; padding: 3px 8px; background: #fef3c7; color: #92400e; font: 600 10px/1 system-ui, sans-serif; letter-spacing: .06em; border-radius: 3px; margin-bottom: 12px; }
  .__chrome-placeholder__title { margin: 0 0 10px; font: 600 22px/1.2 system-ui, sans-serif; color: #0f172a; }
  .__chrome-placeholder__lede { margin: 0 0 12px; }
  .__chrome-placeholder__cta { margin: 0; }
  .__chrome-placeholder__cta a { color: #0c5757; font-weight: 600; }
  .__chrome-placeholder code { background: #eef2f7; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  /* Demo CTA toast (F-7) */
  .__demo-cta-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 6px; font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 99999; max-width: 80vw; opacity: 0; transition: opacity .18s ease; pointer-events: none; }
  .__demo-cta-toast.is-visible { opacity: 1; }
  .__demo-cta-toast code { background: rgba(255,255,255,.14); padding: 1px 6px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>




<section class="y-testimonials  "
         data-component="y-testimonials">

      <div class="y-testimonials__header">
                        <h2 class="y-testimonials__title">What Our Members Say</h2>
              
              <p class="y-testimonials__subtitle">Real stories from real members across our YMCA branches.</p>
          </div>
  
  <div class="y-testimonials__carousel" id="y-testimonials-1">
    
          <input type="radio" class="y-testimonials__radio" id="y-testimonials-1-1" name="y-testimonials-1" checked>
          <input type="radio" class="y-testimonials__radio" id="y-testimonials-1-2" name="y-testimonials-1">
          <input type="radio" class="y-testimonials__radio" id="y-testimonials-1-3" name="y-testimonials-1">
    
    <div class="y-testimonials__track">
      


<figure class="y-testimonial-item " data-component="y-testimonial-item">
  <div class="y-testimonial-item__content">
          <div class="y-testimonial-item__image">
        <img
          src="../assets/photos/y_lb_demo/testimonials_image_1.jpeg"
          alt="Sarah Johnson"
          class="y-testimonial-item__photo"
          loading="lazy"
          width="800"          height="600"        />
      </div>
    
    <div class="y-testimonial-item__body">
              <blockquote class="y-testimonial-item__quote">
          <p>The Y has transformed our family's health and brought us closer together. The kids love the swim lessons.</p>
        </blockquote>
      
              <figcaption class="y-testimonial-item__author">
          <span class="y-testimonial-item__name">&mdash; Sarah Johnson</span>
                      <span class="y-testimonial-item__title">Member since 2018</span>
                  </figcaption>
          </div>
  </div>
</figure>

    </div>

          <div class="y-testimonials__prev">
                  <label for="y-testimonials-1-1" aria-label="Previous testimonial"></label>
                  <label for="y-testimonials-1-2" aria-label="Previous testimonial"></label>
                  <label for="y-testimonials-1-3" aria-label="Previous testimonial"></label>
              </div>

      <div class="y-testimonials__next">
                  <label for="y-testimonials-1-1" aria-label="Next testimonial"></label>
                  <label for="y-testimonials-1-2" aria-label="Next testimonial"></label>
                  <label for="y-testimonials-1-3" aria-label="Next testimonial"></label>
              </div>

      <div class="y-testimonials__nav">
                  <label for="y-testimonials-1-1" aria-label="Go to testimonial 1"></label>
                  <label for="y-testimonials-1-2" aria-label="Go to testimonial 2"></label>
                  <label for="y-testimonials-1-3" aria-label="Go to testimonial 3"></label>
              </div>

      
      <style>
                #y-testimonials-1 .y-testimonials__radio:nth-of-type(1):checked ~ .y-testimonials__prev > label:nth-child(3),
        #y-testimonials-1 .y-testimonials__radio:nth-of-type(1):checked ~ .y-testimonials__next > label:nth-child(2) {
          opacity: 1;
          pointer-events: auto;
          z-index: 5;
        }
                #y-testimonials-1 .y-testimonials__radio:nth-of-type(2):checked ~ .y-testimonials__prev > label:nth-child(1),
        #y-testimonials-1 .y-testimonials__radio:nth-of-type(2):checked ~ .y-testimonials__next > label:nth-child(3) {
          opacity: 1;
          pointer-events: auto;
          z-index: 5;
        }
                #y-testimonials-1 .y-testimonials__radio:nth-of-type(3):checked ~ .y-testimonials__prev > label:nth-child(2),
        #y-testimonials-1 .y-testimonials__radio:nth-of-type(3):checked ~ .y-testimonials__next > label:nth-child(1) {
          opacity: 1;
          pointer-events: auto;
          z-index: 5;
        }
              </style>
      </div>
</section>

<script>
  // Demo CTA neutralizer (Vlad PR #8 F-7) — click on [data-demo-url] toasts
  // the production-shape URL instead of navigating to a non-existent page.
  (function () {
    var toast;
    var hideTimer;
    document.addEventListener('click', function (e) {
      var el = e.target.closest && e.target.closest('[data-demo-url]');
      if (!el) return;
      e.preventDefault();
      if (!toast) {
        toast = document.createElement('div');
        toast.className = '__demo-cta-toast';
        document.body.appendChild(toast);
      }
      toast.innerHTML = 'demo CTA — would link to <code>' + el.getAttribute('data-demo-url').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</code> in production';
      toast.classList.add('is-visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { toast.classList.remove('is-visible'); }, 2200);
    });
  })();
</script>
</body>
</html>
