'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Testimonials
description: Testimonials carousel with member quotes
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Section heading
      examples:
        - 'What Our Members Say'

    subtitle:
      type: string
      title: Subtitle
      description: Section subheading
      examples:
        - 'Real stories from real members'

    items_count:
      type: integer
      title: Items Count
      description: Number of testimonial items (max 10, used for CSS-only carousel)
      default: 5
      examples:
        - 3
        - 5

    show_controls:
      type: boolean
      title: Show Controls
      description: Show navigation arrows and indicators
      default: true
      examples:
        - true

    style:
      type: string
      title: Style
      description: Visual style variant
      default: standard
      enum:
        - standard
        - small-y
      meta:enum:
        standard: 'Standard'
        small-y: 'Small Y'

    heading_level:
      type: string
      title: Heading Level
      description: Semantic heading level
      default: h2
      enum:
        - h2
        - h3
        - h4
      meta:enum:
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
      examples:
        - h2


    section:
      type: string
      title: Section
      description: Page area where this component is placed
      default: body
      enum:
        - banner
        - body
      meta:enum:
        banner: 'Banner Area'
        body: 'Body Area'

slots:
  items:
    title: Testimonial Items
    description: Testimonial item components
    allowedComponents:
      - sdc.y_canvas.y-testimonial-item
  layout:
    title: Component Layout
    description: Spatial arrangement of component areas
    regions:
      title:
        label: Title
      subtitle:
        label: Subtitle
      items:
        label: Testimonial Items
    icon_map:
      mobile:
        - [title]
        - [subtitle]
        - [items]
      tablet:
        - [title]
        - [subtitle]
        - [items]
      desktop:
        - [title]
        - [subtitle]
        - [items]
      large_desktop:
        - [title]
        - [subtitle]
        - [items]

complexity:
  level: medium
  css_lines: 180
  has_js: false
  schema_props: 8
  enum_variants: 6
  demo_pages: 2
  has_media: true
  responsive_breakpoints: 4

libraryOverrides:
  dependencies:
    - y_canvas/y-testimonials
