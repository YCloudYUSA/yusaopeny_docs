'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Statistics
description: Statistics section with animated counters and optional image
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Section heading
      examples:
        - 'Our Impact'

    subtitle:
      type: string
      title: Subtitle
      description: Section subheading
      examples:
        - 'Making a difference in our community'

    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Background Image
      description: Optional background image
      examples:
        - src: '/themes/custom/y_canvas/assets/images/demo/statistics-bg.jpg'
          alt: 'Community impact'
          width: 1200
          height: 400

    cta_text:
      type: string
      title: Button Text
      description: Call-to-action button label
      examples:
        - 'Learn More'

    cta_url:
      type: string
      title: Button URL
      description: Call-to-action button link
      examples:
        - '/about/impact'

    columns:
      type: string
      title: Columns
      description: Number of statistic columns
      default: '4'
      enum:
        - '2'
        - '3'
        - '4'
      meta:enum:
        '2': '2 Columns'
        '3': '3 Columns'
        '4': '4 Columns'
      examples:
        - '4'

    heading_level:
      type: string
      title: Heading Level
      description: Semantic heading level
      default: h2
      enum:
        - h2
        - h3
        - h4
      meta:enum:
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
      examples:
        - h2

    section_color:
      type: string
      title: Section Color
      description: Background color scheme for the section header
      default: colored
      enum:
        - colored
        - gray
      meta:enum:
        colored: 'Brand color gradient'
        gray: 'Gray background'
      examples:
        - colored

    style:
      type: string
      title: Style
      description: Visual style variant
      default: standard
      enum:
        - standard
        - small-y
      meta:enum:
        standard: 'Standard'
        small-y: 'Small Y'


    section:
      type: string
      title: Section
      description: Page area where this component is placed
      default: body
      enum:
        - banner
        - body
      meta:enum:
        banner: 'Banner Area'
        body: 'Body Area'

slots:
  items:
    title: Statistics Items
    description: Statistics item components
    allowedComponents:
      - sdc.y_canvas.y-statistics-item
  layout:
    title: Component Layout
    description: Spatial arrangement of component areas
    regions:
      title:
        label: Title
      subtitle:
        label: Subtitle
      image:
        label: Background Image
      cta:
        label: Call to Action
      items:
        label: Statistics Items
    icon_map:
      mobile:
        - [title]
        - [subtitle]
        - [image]
        - [items]
        - [cta]
      tablet:
        - [title, subtitle]
        - [image, image]
        - [items, items]
        - [cta, cta]
      desktop:
        - [title, subtitle]
        - [image, image]
        - [items, items]
        - [cta, cta]
      large_desktop:
        - [title, subtitle]
        - [image, image]
        - [items, items]
        - [cta, cta]

complexity:
  level: medium
  css_lines: 271
  has_js: false
  schema_props: 11
  enum_variants: 10
  demo_pages: 6
  has_media: true
  responsive_breakpoints: 7

