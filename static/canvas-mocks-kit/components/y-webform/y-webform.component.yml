'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Webform
description: Webform embed container with title and description
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Heading above the webform
      examples:
        - 'Contact Us'

    description:
      type: string
      title: Description
      description: Introductory text above the form (HTML allowed)
      contentMediaType: text/html
      examples:
        - '<p>Fill out the form below and we will get back to you within 24 hours.</p>'

    webform_id:
      type: string
      title: Webform ID
      description: Machine name of the Drupal webform to embed
      examples:
        - 'contact'

    display_style:
      type: string
      title: Display Style
      description: Visual container style for the form
      default: 'default'
      enum:
        - 'default'
        - 'boxed'
        - 'full-width'
      meta:enum:
        default: 'Default'
        boxed: 'Boxed Container'
        full-width: 'Full Width'
      examples:
        - 'default'

    style:
      type: string
      title: Style
      description: Visual style variant
      default: standard
      enum:
        - standard
        - small-y
      meta:enum:
        standard: 'Standard'
        small-y: 'Small Y'


    section:
      type: string
      title: Section
      description: Page area where this component is placed
      default: body
      enum:
        - banner
        - body
      meta:enum:
        banner: 'Banner Area'
        body: 'Body Area'

slots:
  form:
    title: Form Content
    description: The rendered webform
  layout:
    title: Component Layout
    description: Spatial arrangement of component areas
    regions:
      title:
        label: Title
      description:
        label: Description
      form:
        label: Form Content
    icon_map:
      mobile:
        - [title]
        - [description]
        - [form]
      tablet:
        - [title]
        - [description]
        - [form, form]
      desktop:
        - [title]
        - [description]
        - [form, form]
      large_desktop:
        - [title]
        - [description]
        - [form, form]

complexity:
  level: medium
  css_lines: 132
  has_js: false
  schema_props: 7
  enum_variants: 6
  demo_pages: 3
  has_media: false
  responsive_breakpoints: 1

libraryOverrides:
  dependencies:
    - y_canvas/y-webform
