'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Tabs
description: Tabbed content container with multiple panels
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Section heading
      examples:
        - 'Membership Options'

    subtitle:
      type: string
      title: Subtitle
      description: Section subheading
      examples:
        - 'Choose the plan that fits your needs'

    tabs_id:
      type: string
      title: Tabs ID
      description: Unique identifier for the tabs
      examples:
        - 'membership-tabs'

    style:
      type: string
      title: Style
      description: Visual style variant
      default: standard
      enum:
        - standard
        - small-y
      meta:enum:
        standard: 'Standard'
        small-y: 'Small Y'

    heading_level:
      type: string
      title: Heading Level
      description: Semantic heading level
      default: h2
      enum:
        - h2
        - h3
        - h4
      meta:enum:
        h2: 'Heading 2'
        h3: 'Heading 3'
        h4: 'Heading 4'
      examples:
        - h2


    section:
      type: string
      title: Section
      description: Page area where this component is placed
      default: body
      enum:
        - banner
        - body
      meta:enum:
        banner: 'Banner Area'
        body: 'Body Area'

slots:
  items:
    title: Tab Items
    description: Tab item components
    allowedComponents:
      - sdc.y_canvas.y-tab-item
  layout:
    title: Component Layout
    description: Spatial arrangement of component areas
    regions:
      title:
        label: Title
      subtitle:
        label: Subtitle
      items:
        label: Tab Items
    icon_map:
      mobile:
        - [title]
        - [subtitle]
        - [items]
      tablet:
        - [title]
        - [subtitle]
        - [items]
      desktop:
        - [title]
        - [subtitle]
        - [items]
      large_desktop:
        - [title]
        - [subtitle]
        - [items]

complexity:
  level: medium
  css_lines: 187
  has_js: true
  schema_props: 7
  enum_variants: 6
  demo_pages: 2
  has_media: false
  responsive_breakpoints: 5

libraryOverrides:
  dependencies:
    - y_canvas/y-tabs
