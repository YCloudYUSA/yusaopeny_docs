'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Camp Quick Links
description: Quick access links grid for camp pages
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: Section heading for quick links
      examples:
        - 'Quick Links'

    columns:
      type: integer
      title: Number of Columns
      description: Grid column count for link layout
      default: 4
      enum:
        - 2
        - 3
        - 4
      meta:enum:
        2: '2 Columns'
        3: '3 Columns'
        4: '4 Columns'
      examples:
        - 4

    style:
      type: string
      title: Style
      description: Visual style variant
      default: standard
      enum:
        - standard
        - small-y
      meta:enum:
        standard: 'Standard'
        small-y: 'Small Y'


    section:
      type: string
      title: Section
      description: Page area where this component is placed
      default: body
      enum:
        - banner
        - body
      meta:enum:
        banner: 'Banner Area'
        body: 'Body Area'

slots:
  links:
    title: Quick Link Items
    description: Quick link card items with icons
  layout:
    title: Component Layout
    description: Spatial arrangement of component areas
    regions:
      title:
        label: Title
      links:
        label: Quick Link Items
    icon_map:
      mobile:
        - [title]
        - [links]
      tablet:
        - [title]
        - [links, links]
      desktop:
        - [title]
        - [links, links]
      large_desktop:
        - [title]
        - [links, links]

complexity:
  level: simple
  css_lines: 94
  has_js: false
  schema_props: 5
  enum_variants: 6
  demo_pages: 2
  has_media: false
  responsive_breakpoints: 2

libraryOverrides:
  dependencies:
    - y_canvas/y-camp-quick-links
