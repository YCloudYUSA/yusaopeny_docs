'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Nav Link
description: Navigation link item for the main menu
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Link Title
      description: Display text for the link
      examples:
        - 'Programs'

    url:
      type: string
      title: Link URL
      description: Link destination
      examples:
        - '/programs'

slots:
  children:
    title: Submenu Links
    description: Child navigation links for dropdown submenu
    allowedComponents:
      - sdc.y_canvas.y-nav-link
  layout:
    title: Component Layout
    description: Spatial arrangement of link areas
    regions:
      link:
        label: Link
      submenu:
        label: Submenu
    icon_map:
      mobile:
        - [link]
        - [submenu]
      tablet:
        - [link]
        - [submenu]
      desktop:
        - [link]
        - [submenu]
      large_desktop:
        - [link]
        - [submenu]

complexity:
  level: simple
  css_lines: 1
  has_js: false
  schema_props: 3
  enum_variants: 0
  demo_pages: 0
  has_media: false
  responsive_breakpoints: 0

libraryOverrides:
  dependencies:
    - y_canvas/y-nav-link
