'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'

name: Y Partners
description: Partners section with title, subtitle, and tiered partner logos
status: experimental
group: Organisms

props:
  type: object
  properties:
    title:
      type: string
      title: Section Title
      description: Main heading for the partners section
      examples:
        - 'Our Partners'

    subtitle:
      type: string
      title: Section Subtitle
      description: Optional description text below the heading
      examples:
        - 'We are proud to partner with these organizations'

    show_header:
      type: boolean
      title: Show Header
      description: Display the title and subtitle header section
      default: true
      examples:
        - true

    style:
      type: string
      title: Style
      description: Visual style variant
      default: standard
      enum:
        - standard
        - small-y
      meta:enum:
        standard: 'Standard'
        small-y: 'Small Y'


    section:
      type: string
      title: Section
      description: Page area where this component is placed
      default: body
      enum:
        - banner
        - body
      meta:enum:
        banner: 'Banner Area'
        body: 'Body Area'

slots:
  tiers:
    title: Partner Tiers
    description: Partner tier groups containing partner items
  layout:
    title: Component Layout
    description: Spatial arrangement of component areas
    regions:
      title:
        label: Section Title
      subtitle:
        label: Section Subtitle
      tiers:
        label: Partner Tiers
    icon_map:
      mobile:
        - [title]
        - [subtitle]
        - [tiers]
      tablet:
        - [title]
        - [subtitle]
        - [tiers]
      desktop:
        - [title, tiers]
        - [subtitle, tiers]
      large_desktop:
        - [title, tiers]
        - [subtitle, tiers]

complexity:
  level: simple
  css_lines: 80
  has_js: false
  schema_props: 6
  enum_variants: 4
  demo_pages: 2
  has_media: true
  responsive_breakpoints: 1

libraryOverrides:
  dependencies:
    - y_canvas/y-partners
