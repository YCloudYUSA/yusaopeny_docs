<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y-card-item · default (slot-child of y-cards)</title>
<link rel="stylesheet" href="../_fonts.css">
<link rel="stylesheet" href="../assets/y_canvas/css/y-canvas.css">
<link rel="stylesheet" href="../components/y-cards/y-cards.css">
<link rel="stylesheet" href="../components/y-card-item/y-card-item.css">

<style>
  /* Frame baseline — fonts/tokens come from y-canvas.css above (theme SoT).
   * Per-SDC fonts (Cachet vs Verdana per ws_small_y rules) opt-in via
   * --ylb-font-family-cachet / --ylb-font-family-verdana token references
   * inside each component's CSS. Frame imposes nothing extra. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body > [data-component] { overflow: hidden; }

  /* Chrome SDC placeholder (F-8) — visually distinct from broken render */
  .__chrome-placeholder { display: flex; align-items: center; justify-content: center; min-height: 320px; padding: 32px 16px; background: repeating-linear-gradient(45deg, #f5f7fb, #f5f7fb 10px, #ecf0f7 10px, #ecf0f7 20px); }
  .__chrome-placeholder__inner { max-width: 520px; padding: 28px 32px; background: #fff; border: 1px solid #d6dde8; border-radius: 10px; box-shadow: 0 4px 16px rgba(15, 23, 42, .06); font: 14px/1.55 system-ui, -apple-system, sans-serif; color: #1f2937; }
  .__chrome-placeholder__badge { display: inline-block; padding: 3px 8px; background: #fef3c7; color: #92400e; font: 600 10px/1 system-ui, sans-serif; letter-spacing: .06em; border-radius: 3px; margin-bottom: 12px; }
  .__chrome-placeholder__title { margin: 0 0 10px; font: 600 22px/1.2 system-ui, sans-serif; color: #0f172a; }
  .__chrome-placeholder__lede { margin: 0 0 12px; }
  .__chrome-placeholder__cta { margin: 0; }
  .__chrome-placeholder__cta a { color: #0c5757; font-weight: 600; }
  .__chrome-placeholder code { background: #eef2f7; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  /* Demo CTA toast (F-7) */
  .__demo-cta-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 6px; font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 99999; max-width: 80vw; opacity: 0; transition: opacity .18s ease; pointer-events: none; }
  .__demo-cta-toast.is-visible { opacity: 1; }
  .__demo-cta-toast code { background: rgba(255,255,255,.14); padding: 1px 6px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>




<div class="y-cards y-cards--standard y-cards--cols-4 y-cards--border-solid y-cards--align-left  " data-component="y-cards">
      <div class="y-cards__header">
              <div class="y-cards__header-text">
                                    <h2 class="y-cards__title">Our Programs</h2>
                      
                      <p class="y-cards__subtitle">
              Discover programs designed for all ages and interests across our YMCA branches.
            </p>
                  </div>
      
              <div class="y-cards__header-cta">
          <a href="#" data-demo-url="/programs" class="y-cards__cta-link">
            View All Programs
            <svg class="y-cards__cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
        </div>
          </div>
  
  <div class="y-cards__grid">
    



<article class="y-card-item y-card-item--has-image " data-component="y-card-item">
      <div class="y-card-item__image-wrapper">
      
      <div class="y-card-item__chevron" aria-hidden="true">
        <svg preserveAspectRatio="none" viewBox="0 0 863 610" xmlns="http://www.w3.org/2000/svg">
          <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">

            <path d="M710.164443,287.453806 L708.894623,285.264012 L566.950849,38.2331146 L564.466419,33.9089651 C551.699258,12.5350138 528.554009,-0.384834781 503.735904,0.00874206473 L0,0.0177360411 L0.378555001,610 L526.12338,609.991006 C550.942917,610.390316 574.090828,597.468982 586.853895,576.090783 L589.338325,571.766633 L708.867019,363.874832 L711.075401,360.021904 C717.132215,349.149681 720.208928,336.858896 719.991745,324.403109 C720.043758,311.439517 716.682037,298.692489 710.247258,287.453806 L710.164443,287.453806 Z" fill="var(--wsSecondaryColor, #01A490)"/>
          </g>
        </svg>
      </div>
      <div class="y-card-item__img-container">
        <img
          src="../assets/photos/y_lb_demo/homepage_image_1.jpeg"
          alt="Youth & Family programs"

          width="800"          height="600"        />
      </div>
    </div>
  
  <div class="y-card-item__content">
    
          <span class="y-card-item__tag">Programs</span>
    
    <h3 class="y-card-item__title">
              <a href="#" data-demo-url="/programs/youth" class="y-card-item__title-link">
          Youth & Family

          <div class="y-card-item__description">
        <p>Programs that bring families together — sports leagues, day camps, and arts.</p>

          <div class="y-card-item__footer">
        <a href="#" data-demo-url="/programs/youth" class="y-card-item__cta">
          Learn More
          <svg class="y-card-item__cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
      </div>
</article>

  </div>
</div>

<script>
  // Demo CTA neutralizer (Vlad PR #8 F-7) — click on [data-demo-url] toasts
  // the production-shape URL instead of navigating to a non-existent page.
  (function () {
    var toast;
    var hideTimer;
    document.addEventListener('click', function (e) {
      var el = e.target.closest && e.target.closest('[data-demo-url]');
      if (!el) return;
      e.preventDefault();
      if (!toast) {
        toast = document.createElement('div');
        toast.className = '__demo-cta-toast';
        document.body.appendChild(toast);
      }
      toast.innerHTML = 'demo CTA — would link to <code>' + el.getAttribute('data-demo-url').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</code> in production';
      toast.classList.add('is-visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () { toast.classList.remove('is-visible'); }, 2200);
    });
  })();
</script>
</body>
</html>
